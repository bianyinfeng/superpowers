[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deriv-risk"
version = "0.1.0"
description = "期权期货风险测度研究：Greeks可视化、组合策略分析、量化因子与仓位管理"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "plotly>=5.15",
    "yfinance>=0.2.18",
    "matplotlib>=3.7",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
notebook = ["jupyter", "ipywidgets"]
